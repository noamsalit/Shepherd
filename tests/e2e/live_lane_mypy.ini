; The live lane's type profile. Deliberately **not** `pyproject.toml`'s
; `[tool.mypy]`, which is `--strict` with `disallow_any_explicit` and was written
; for `src/`: the suite has never been strict and turning it on here would be 233
; errors in 108 files, which is a gate nobody can land.
;
; What this profile is for is narrower and is the thing that actually broke: a
; module the default run never executes can carry a `TypeError` — a call with the
; wrong arity, a name that no longer exists, an import that no longer resolves —
; and stay green for hours, because it is deselected and a deselected test is not
; a failing test. `follow_imports = silent` keeps the check on the files handed to
; it rather than on everything they import, so the gate reports the live lane's
; own errors and never `src/`'s.
[mypy]
python_version = 3.12
ignore_missing_imports = True
explicit_package_bases = True
follow_imports = silent
mypy_path = src, tests
